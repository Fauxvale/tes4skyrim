name: Tag on push to master

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compute and push next tag
        run: |
          git fetch --tags

          latest=$(git tag -l '[0-9]*.[0-9][0-9]' | sort -t. -k1,1n -k2,2n | tail -n1)

          if [ -z "$latest" ]; then
            cents=0
          else
            major=$(echo "$latest" | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            cents=$((10#$major * 100 + 10#$minor))
          fi

          next_cents=$((cents + 1))
          next_major=$((next_cents / 100))
          next_minor=$((next_cents % 100))
          next_tag=$(printf "%d.%02d" "$next_major" "$next_minor")

          echo "Latest tag: ${latest:-<none>}"
          echo "Next tag: $next_tag"

          # Commit list + the GUI steps those commits require re-running.
          if [ -n "$latest" ]; then
            python tools/release_notes.py --from "$latest" --to HEAD \
                                          --tag "$next_tag" --output "$RUNNER_TEMP/notes.txt"
          else
            python tools/release_notes.py --to HEAD \
                                          --tag "$next_tag" --output "$RUNNER_TEMP/notes.txt"
          fi
          cat "$RUNNER_TEMP/notes.txt"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -F "$RUNNER_TEMP/notes.txt"
          git push origin "$next_tag"

          # Surface the same notes in the Actions run summary.
          {
            echo '```'
            cat "$RUNNER_TEMP/notes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
