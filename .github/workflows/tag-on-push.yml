name: Tag on push to master

on:
  push:
    branches:
      - master

permissions:
  contents: write

# A second push while the first run is still tagging would compute the same
# "next" tag and fail on the push.  Serialise instead.
concurrency:
  group: tag-on-push
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compute and push next tag
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Tags are MAJOR.MMM (thousandths) from 0.581 on; 0.58 and earlier
          # are MAJOR.MM (hundredths).  A 2-digit minor is worth TEN of the new
          # units -- 0.58 IS 0.580 -- so scale by the field's width.  `sort -n`
          # cannot do this: it compares 58 against 580 and would rank 0.59
          # above 0.580.  Compute the max numerically instead.
          latest=""
          latest_mils=0
          for t in $(git tag -l '[0-9]*.[0-9][0-9]' '[0-9]*.[0-9][0-9][0-9]'); do
            major=${t%%.*}
            minor=${t#*.}
            case ${#minor} in
              2) mils=$((10#$major * 1000 + 10#$minor * 10)) ;;
              3) mils=$((10#$major * 1000 + 10#$minor)) ;;
              *) continue ;;
            esac
            if [ "$mils" -gt "$latest_mils" ]; then
              latest_mils=$mils
              latest=$t
            fi
          done

          # Nothing to do if HEAD is already tagged -- e.g. a workflow re-run,
          # or a push that only moved a branch pointer.
          #
          # This also absorbs the release-stamp commit this job pushes below.
          # That commit carries [skip ci], but it is ALSO the commit the tag
          # lands on, so even if the marker were ignored the re-triggered run
          # finds HEAD already tagged and exits here.  Two independent guards,
          # because a loop in a tagging workflow burns a tag number per lap.
          if [ -n "$latest" ] && [ "$(git rev-parse "$latest^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already tagged $latest -- nothing to do."
            echo "HEAD is already tagged \`$latest\`; no new tag created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Advance past any name already taken (a tag created out of sort
          # order, or a race the concurrency group didn't cover).
          next_mils=$latest_mils
          while :; do
            next_mils=$((next_mils + 1))
            next_tag=$(printf "%d.%03d" $((next_mils / 1000)) $((next_mils % 1000)))
            git rev-parse -q --verify "refs/tags/$next_tag" >/dev/null || break
            echo "Tag $next_tag already exists, trying the next one."
          done

          echo "Latest tag: ${latest:-<none>}"
          echo "Next tag: $next_tag"

          # Commit list + the GUI steps those commits require re-running.
          if [ -n "$latest" ]; then
            python tools/release_notes.py --from "$latest" --to HEAD \
                                          --tag "$next_tag" --output "$RUNNER_TEMP/notes.txt"
          else
            python tools/release_notes.py --to HEAD \
                                          --tag "$next_tag" --output "$RUNNER_TEMP/notes.txt"
          fi
          cat "$RUNNER_TEMP/notes.txt"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stamp the version INTO the tree before tagging, so a source drop
          # knows what it is without a .git directory -- the release zip
          # GitHub generates has none, and that is how users install.
          # UPGRADE_STEPS.json gains this release's step list at the same
          # time, letting an offline install work out what an upgrade owes.
          echo "$next_tag" > VERSION
          # Rebuild from the WHOLE tag history, then add the release being cut.
          # `--add` alone would be wrong here: the stamp commit never lands on
          # master (see below), so master's table never accumulates entries and
          # each tag would carry only its own.  A user upgrading across two
          # releases would then hit a hole, which reads as "unknown" and
          # selects all twelve steps forever.  Rebuilding makes every tag's
          # table complete up to itself.
          python tools/upgrade_table.py
          python tools/upgrade_table.py --add "$next_tag" --to HEAD

          # Commit the stamp LOCALLY and tag that commit, then push ONLY the
          # tag.  master is protected by a ruleset ("changes must be made
          # through a pull request") and the Actions bot is not a bypass actor,
          # so `git push origin HEAD:master` is rejected with GH013 and takes
          # the whole tagging step down with it -- which is exactly what
          # happened on the 0.581 attempt.
          #
          # Pushing only the tag is enough: the tag is what users download, so
          # it carries VERSION and UPGRADE_STEPS.json regardless of whether
          # master has them.  The stamp commit itself is deliberately NOT on
          # master -- it exists only to be tagged.
          #
          # `git commit` exits non-zero on an empty index and `set -e` would
          # abort with it, so only commit when something actually changed
          # (a re-run can find both files already correct).
          git add VERSION UPGRADE_STEPS.json
          if git diff --cached --quiet; then
            echo "VERSION and UPGRADE_STEPS.json already current."
          else
            git commit -m "chore(release): stamp $next_tag"
          fi

          # Tag the stamped commit, not the one below it, so the tree a user
          # downloads carries its own version number.
          git tag -a "$next_tag" -F "$RUNNER_TEMP/notes.txt"
          git push origin "$next_tag"

          # Surface the same notes in the Actions run summary.
          {
            echo '```'
            cat "$RUNNER_TEMP/notes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
